<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mara Marisa Benítez · Potencia tu Comunicación</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans+Condensed:wght@600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #1a1310;
      --copper: #c99a6f;
      --copper-line: #c7976d;
      --cream: #f4eee8;
      --white: #f9f3e5;
      --rule: #69503f;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Hanken Grotesk', system-ui, sans-serif;
      background: #120d0a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      -webkit-text-size-adjust: 100%;
    }

    .card {
      position: relative;
      width: 100%;
      max-width: 480px;
      background-color: var(--bg);
      background-image:
        url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='900' height='1500' viewBox='0 0 900 1500'><filter id='n' x='0' y='0' width='100%' height='100%'><feTurbulence type='fractalNoise' baseFrequency='0.006 0.011' numOctaves='5' seed='11' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.60  0 0 0 0 0.46  0 0 0 0 0.36  0 0 0 0.10 0'/></filter><rect width='900' height='1500' filter='url(%23n)'/></svg>"),
        linear-gradient(160deg, #211814 0%, #17100d 100%);
      background-size: cover, auto;
      background-repeat: no-repeat;
      border: 1.5px solid var(--copper-line);
      border-radius: 24px;
      padding: 2.75rem 1.5rem 3.25rem;
    }

    /* Encabezado */
    .brand {
      text-align: center;
      font-weight: 600;
      font-size: clamp(0.78rem, 3.3vw, 1rem);
      letter-spacing: 0.2em;
      white-space: nowrap;
      text-transform: uppercase;
      color: var(--copper);
    }

    .star-rule {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin: 1rem 0 1.75rem;
      color: var(--copper);
    }
    .star-rule::before,
    .star-rule::after {
      content: "";
      flex: 1;
      height: 1.5px;
      background: var(--copper-line);
    }
    .star-rule span { font-size: 1rem; line-height: 1; }

    .name {
      text-align: center;
      font-family: 'IBM Plex Sans Condensed', 'Hanken Grotesk', sans-serif;
      font-weight: 700;
      font-size: clamp(2.1rem, 9.6vw, 3.1rem);
      line-height: 1.1;
      color: var(--cream);
    }

    .title {
      text-align: center;
      margin-top: 1rem;
      font-size: clamp(1rem, 4.2vw, 1.2rem);
      line-height: 1.4;
      color: var(--copper);
    }

    .short-rule {
      width: 64px;
      height: 3px;
      margin: 1.75rem auto 2.25rem;
      border-radius: 2px;
      background: var(--copper);
    }

    /* Contacto */
    .section-title {
      font-weight: 600;
      font-size: clamp(1.05rem, 4.4vw, 1.3rem);
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--copper);
      margin-bottom: 1.25rem;
    }

    .contact-list { list-style: none; }

    .contact-item {
      display: flex;
      align-items: center;
      gap: 0.9rem;
      padding: 1rem 0;
      border-bottom: 1.5px solid var(--rule);
      text-decoration: none;
      color: inherit;
      -webkit-tap-highlight-color: transparent;
    }
    .contact-item:hover .contact-value,
    .contact-item:focus-visible .contact-value { color: var(--copper); }
    .contact-item:focus-visible { outline: 2px solid var(--copper); outline-offset: 4px; border-radius: 8px; }

    .contact-list li:last-child .contact-item { border-bottom: 1.5px solid var(--rule); }

    .icon {
      width: 52px;
      height: 52px;
      flex-shrink: 0;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 35% 30%, #d9ae88, #b98963);
      color: #20160f;
    }
    .icon svg { width: 28px; height: 28px; }

    .contact-text { flex: 1; min-width: 0; container-type: inline-size; }

    .contact-label {
      font-size: clamp(1rem, 4vw, 1.15rem);
      color: var(--copper);
      line-height: 1.3;
    }

    .contact-value {
      font-size: clamp(1.05rem, 4.5vw, 1.3rem);
      font-weight: 500;
      color: var(--white);
      line-height: 1.35;
      overflow-wrap: anywhere;
      transition: color 0.2s;
    }
    .contact-value.strong {
      font-weight: 700;
      font-size: clamp(0.8rem, 3.6vw, 1.15rem);
      font-size: min(1.15rem, 5.5cqw);
      overflow-wrap: normal;
      word-break: keep-all;
      white-space: nowrap;
    }

    @media (max-width: 420px) {
      body { padding: 0.5rem; }
      .card { padding-left: 1.25rem; padding-right: 1.25rem; }
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="brand">Potencia tu Comunicacion</div>
    <div class="star-rule" aria-hidden="true"><span>✦</span></div>

    <h1 class="name">Mara Marisa Benítez</h1>
    <p class="title">Lic. en Comunicación · Consultora Organizacional</p>
    <div class="short-rule" aria-hidden="true"></div>

    <h2 class="section-title">Contacto</h2>
    <ul class="contact-list">

          </span>

      <li>
        <a class="contact-item" href="https://www.linkedin.com/in/mara-benitez" target="_blank" rel="noopener">
          <span class="icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="currentColor"><rect x="3.5" y="9" width="3.6" height="11.5" rx="0.6"/><circle cx="5.3" cy="5.3" r="2.1"/><path d="M10 9h3.4v1.6c.6-1.100 1.900-1.900 3.600-1.900 3.100 0 3.900 2 3.900 4.800v7H17.300v-6.200c0-1.500-.3-2.600-1.800-2.600-1.600 0-2 1.200-2 2.700v6.100H10z"/></svg>
          </span>
          <span class="contact-text">
            <span class="contact-label">LinkedIn</span><br />
            <span class="contact-value">Mara Marisa Benítez</span>
          </span>
        </a>
      </li>
      <li>
        <a class="contact-item" href="https://www.instagram.com/potenciatucomunicacio/" target="_blank" rel="noopener">
          <span class="icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="17" height="17" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.200" cy="6.800" r="0.9" fill="currentColor" stroke="none"/></svg>
          </span>
          <span class="contact-text">
            <span class="contact-label">Instagram</span><br />
            <span class="contact-value">@potenciatucomunicacio</span>
          </span>
        </a>
      </li>
      <li>
        <a class="contact-item" href="https://editorcontent.github.io/potencia-web/" target="_blank" rel="noopener">
          <span class="icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3c2.600 2.500 3.900 5.500 3.900 9s-1.300 6.500-3.900 9c-2.600-2.500-3.900-5.500-3.900-9S9.400 5.500 12 3z"/></svg>
          </span>
          <span class="contact-text">
            <span class="contact-label">Web</span><br />
            <span class="contact-value strong">www.potenciatucomunicacion.com</span>
          </span>
        </a>
      </li>
    </ul>
  </main>
</body>
</html>
